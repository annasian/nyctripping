function makeIcon(kind, label, color){
  var cls = kind==='home' ? 'pin home' : 'pin';
  return L.divIcon({
    className:'pin-wrap',
    html:'<div class="'+cls+'" style="background:'+color+'"><span>'+label+'</span></div>',
    iconSize: kind==='home' ? [22,22] : [30,38],
    iconAnchor: kind==='home' ? [11,11] : [15,36],
    popupAnchor: kind==='home' ? [0,-10] : [0,-32]
  });
}

function popHTML(tag, name, desc, lat, lng){
  var mapUrl = 'https://www.google.com/maps/dir/?api=1&destination='+lat+','+lng;
  return '<div class="pop"><div class="pt">'+tag+'</div><h3 class="pn">'+name+'</h3><p class="pd">'+desc+'</p><a class="btn" href="'+mapUrl+'" target="_blank" rel="noopener">Open in Maps</a></div>';
}

var map = L.map('map', { zoomControl:true, attributionControl:false }).setView([40.73, -73.99], 12);
L.tileLayer('https://{s}.basemaps.cartocdn.com/light_all/{z}/{x}/{y}{r}.png', { maxZoom:19 }).addTo(map);

var baseLayer = L.layerGroup().addTo(map);
var homeMarker = L.marker([HOME.lat, HOME.lng], { icon: makeIcon('home','A','#333') });
var momMarker  = L.marker([MOM.lat,  MOM.lng ], { icon: makeIcon('home','M','#333') });
homeMarker.bindPopup(popHTML('HOME BASE', HOME.name, HOME.note, HOME.lat, HOME.lng));
momMarker.bindPopup(popHTML('WED–SAT NIGHTS', MOM.name, MOM.note, MOM.lat, MOM.lng));
baseLayer.addLayer(homeMarker);
baseLayer.addLayer(momMarker);

var dayLayer = L.layerGroup().addTo(map);
var activeDay = 1;

function buildDayPills(){
  var wrap = document.getElementById('days');
  wrap.innerHTML = '';
  var all = [WELCOME].concat(DAYS);
  all.forEach(function(d){
    var btn = document.createElement('button');
    btn.className = 'pill';
    btn.dataset.day = d.n;
    var label = d.pillLabel || d.date.split(' · ')[0];
    btn.innerHTML = '<span class="dot" style="background:var('+d.color+')"></span>'+label;
    btn.addEventListener('click', function(){ selectDay(d.n); });
    wrap.appendChild(btn);
  });
}

function selectDay(n){
  activeDay = n;
  document.querySelectorAll('.pill').forEach(function(p){
    p.classList.toggle('active', Number(p.dataset.day)===n);
  });
  renderDay();
}

function renderDay(){
  if (activeDay === 0) { renderWelcome(); return; }
  var d;
  for (var i=0;i<DAYS.length;i++){ if (DAYS[i].n===activeDay){ d = DAYS[i]; break; } }
  if (!d) return;
  var color = getComputedStyle(document.documentElement).getPropertyValue(d.color).trim();
  dayLayer.clearLayers();
  var bounds = [];
  d.stops.forEach(function(s, i){
    var m = L.marker([s.lat, s.lng], { icon: makeIcon('day', String(i+1), color) });
    m.bindPopup(popHTML(s.t, s.n, s.d, s.lat, s.lng), { maxWidth: 280 });
    m.addTo(dayLayer);
    bounds.push([s.lat, s.lng]);
  });
  if(bounds.length){ map.fitBounds(bounds, { padding:[40,40], maxZoom: 14 }); }
  var tagClass = d.together ? 'together' : 'solo';
  var panel = document.getElementById('panel');
  var stopsHtml = '';
  d.stops.forEach(function(s, i){
    stopsHtml += '<div class="stop" data-i="'+i+'"><div class="stime">'+s.t+'</div><div><div class="sname">'+s.n+'</div><div class="snote">'+s.d+'</div></div></div>';
  });
  panel.innerHTML = '<div class="ptitle">'+d.date+'</div><h2 class="pday">'+d.title+'</h2><span class="tag '+tagClass+'">'+d.tag+'</span><p class="pnarr">'+d.narrative+'</p><div class="stops">'+stopsHtml+'</div>';
  panel.querySelectorAll('.stop').forEach(function(el){
    el.addEventListener('click', function(){
      var i = Number(el.dataset.i);
      var s = d.stops[i];
      map.flyTo([s.lat, s.lng], 15, { duration: .6 });
      dayLayer.eachLayer(function(layer){
        var ll = layer.getLatLng();
        if(Math.abs(ll.lat - s.lat) < 1e-6 && Math.abs(ll.lng - s.lng) < 1e-6){
          layer.openPopup();
        }
      });
    });
  });
}

function renderWelcome(){
  var d = WELCOME;
  dayLayer.clearLayers();
  map.flyTo([HOME.lat, HOME.lng], 15, { duration:.5 });
  var tagClass = 'together';
  var panel = document.getElementById('panel');
  var stopsHtml = '';
  d.sections.forEach(function(s, i){
    stopsHtml += '<div class="stop" data-i="'+i+'"><div class="stime">·</div><div><div class="sname">'+s.h+'</div><div class="snote">'+s.b+'</div></div></div>';
  });
  panel.innerHTML = '<div class="ptitle">'+d.date+'</div><h2 class="pday">'+d.title+'</h2><span class="tag '+tagClass+'">'+d.tag+'</span><p class="pnarr">'+d.narrative+'</p><div class="stops">'+stopsHtml+'</div>';
}
