<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <rect width="32" height="32" rx="6" fill="#0A0A0A"/>
  <!-- blue corner accent -->
  <rect x="0" y="0" width="32" height="3" fill="#006BB6"/>
  <!-- pigeon body -->
  <ellipse cx="12" cy="20" rx="9" ry="5" fill="#9C9C9C"/>
  <!-- wing -->
  <ellipse cx="10" cy="20" rx="6" ry="3" fill="#6E6E6E"/>
  <!-- tail -->
  <path d="M 3 19 L 0 17 L 0 21 L 4 22 Z" fill="#5A5A5A"/>
  <!-- head -->
  <circle cx="19" cy="16" r="4" fill="#9C9C9C"/>
  <!-- eye -->
  <circle cx="20.5" cy="14.8" r="0.8" fill="#FFFFFF"/>
  <circle cx="20.5" cy="14.8" r="0.4" fill="#0A0A0A"/>
  <!-- beak (orange) -->
  <path d="M 22.5 16 L 25.5 14.5 L 25.5 17.5 Z" fill="#F58426"/>
  <!-- pizza slice in beak -->
  <path d="M 25.5 16 L 32 11 L 32 21 Z" fill="#E8B547" stroke="#8B6914" stroke-width="0.4"/>
  <!-- pepperoni -->
  <circle cx="28.5" cy="14" r="1" fill="#D03A2B"/>
  <circle cx="29" cy="18.5" r="1" fill="#D03A2B"/>
  <!-- legs (orange) -->
  <rect x="10" y="24" width="1.2" height="4" fill="#F58426"/>
  <rect x="13" y="24" width="1.2" height="4" fill="#F58426"/>
</svg>
