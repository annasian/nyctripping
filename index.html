<style>
  :root{
    --bg:#0A0A0A;
    --bg-deep:#141414;
    --surface:#1A1A1A;
    --surface-hi:#222222;
    --border:#2A2A2A;
    --border-hi:#3A3A3A;
    --ink:#FFFFFF;
    --ink-soft:#A8A8A8;
    --ink-tertiary:#6E6E6E;
    --knicks-blue:#006BB6;
    --knicks-orange:#F58426;
    --serif:'Fraunces', Georgia, serif;
    --mono:'Space Mono', ui-monospace, monospace;
    --script:'Caveat', cursive;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{background:var(--bg);color:var(--ink);font-family:var(--serif);font-weight:400}
  body{overflow-x:hidden;min-height:100vh}
  a{color:inherit;text-decoration:none}
  button{font:inherit;color:inherit;background:none;border:none;cursor:pointer}
  ::selection{background:var(--knicks-orange);color:var(--bg)}

  /* (status bar removed for chill) */

  /* ───── marquee ───── */
  .marquee{background:var(--knicks-blue);color:var(--ink);font-family:var(--serif);font-style:italic;font-weight:400;font-size:22px;padding:10px 0;overflow:hidden;white-space:nowrap;border-bottom:1px solid #1D428A}
  .marquee-track{display:inline-block;animation:scroll 40s linear infinite;font-variation-settings:"SOFT" 100,"WONK" 1}
  .marquee-track span{margin:0 24px}
  .marquee-track .glyph{font-style:normal;color:var(--knicks-orange)}
  @keyframes scroll{0%{transform:translateX(0)}100%{transform:translateX(-50%)}}

  /* ───── nav ───── */
  nav{display:flex;justify-content:space-between;align-items:center;padding:18px 32px;border-bottom:1px solid var(--border);font-family:var(--mono);font-size:12px;background:var(--bg)}
  .brand{display:flex;align-items:baseline;gap:10px}
  .brand .logo{font-family:var(--serif);font-weight:500;font-size:22px;font-style:italic;font-variation-settings:"SOFT" 80,"WONK" 1;color:var(--ink)}
  .brand .est{color:var(--ink-soft);font-size:10px;letter-spacing:.08em;text-transform:uppercase}
  nav .right{color:var(--ink-soft)}
  nav .right a{color:var(--ink-soft)}
  nav .right a:hover{color:var(--knicks-orange)}

  /* ───── hero ───── */
  .hero{padding:80px 32px 120px;position:relative;overflow:hidden;min-height:80vh;display:flex;flex-direction:column;justify-content:center}
  .hero-frame{max-width:1100px;margin:0 auto;text-align:center;position:relative;z-index:2}
  .kicker{font-family:var(--mono);font-size:11px;letter-spacing:.18em;text-transform:uppercase;color:var(--knicks-orange);margin-bottom:32px}
  .kicker::before{content:"●  ";color:var(--knicks-orange)}
  h1{font-family:var(--serif);font-size:clamp(64px,11vw,160px);font-weight:400;line-height:.92;letter-spacing:-.03em;color:var(--ink);font-variation-settings:"SOFT" 100,"WONK" 1;margin-bottom:24px}
  h1 em{font-style:italic;color:var(--knicks-orange)}
  .dek{font-family:var(--mono);font-size:14px;line-height:1.7;color:var(--ink-soft);max-width:46ch;margin:0 auto 48px;letter-spacing:.01em}
  .dek em{font-family:var(--serif);font-style:italic;font-size:17px;color:var(--ink);font-variation-settings:"SOFT" 100;letter-spacing:-.005em}

  /* spin button */
  .spin-btn{
    font-family:var(--serif);font-style:italic;font-size:32px;
    font-variation-settings:"SOFT" 100,"WONK" 1;font-weight:500;
    background:var(--knicks-orange);color:var(--bg);
    padding:28px 64px;border-radius:80px;border:3px solid var(--knicks-orange);
    display:inline-flex;align-items:center;gap:18px;cursor:pointer;
    transition:all .25s;letter-spacing:-.01em;position:relative;
  }
  .spin-btn:hover{background:var(--knicks-blue);color:var(--ink);border-color:var(--knicks-blue);transform:rotate(-1.5deg) scale(1.04)}
  .spin-btn:active{transform:scale(.98)}
  .spin-btn .arrow{font-family:var(--serif);font-style:normal;font-size:36px}
  .spin-btn.spinning{pointer-events:none;animation:wiggle .15s linear infinite}
  @keyframes wiggle{0%,100%{transform:rotate(-1deg)}50%{transform:rotate(1deg)}}

  .sub-note{font-family:var(--mono);font-size:11px;color:var(--ink-tertiary);margin-top:24px;letter-spacing:.04em}

  /* spinning state — flashes through places */
  .spinning-display{
    margin-top:48px;height:60px;display:flex;align-items:center;justify-content:center;
    font-family:var(--serif);font-style:italic;font-size:32px;color:var(--knicks-orange);
    font-variation-settings:"SOFT" 100,"WONK" 1;opacity:0;transition:opacity .3s;
  }
  .spinning-display.on{opacity:1}

  /* squiggle */
  .squiggle{position:absolute;right:8%;top:18%;width:180px;height:60px;opacity:.85;pointer-events:none;z-index:1}

  /* pigeon — original walking left → right */
  .pigeon{position:absolute;bottom:60px;width:54px;height:36px;z-index:1;pointer-events:none;animation:walk-by 22s linear infinite;animation-delay:3s}
  .pigeon-head{transform-origin:42px 16px;animation:bob .55s steps(2,end) infinite}
  @keyframes walk-by{0%{left:-80px;opacity:0}3%{opacity:1}97%{opacity:1}100%{left:calc(100% + 80px);opacity:0}}
  @keyframes bob{0%,49.99%{transform:translate(0,0)}50%,100%{transform:translate(-2px,-2px)}}

  /* second pigeon, mirrored, walking right → left, smaller */
  .pigeon-2{transform:scaleX(-1);bottom:90px;width:42px;height:28px;animation:walk-back 28s linear infinite;animation-delay:10s;opacity:.85}
  @keyframes walk-back{0%{right:-80px;opacity:0;left:auto}3%{opacity:1}97%{opacity:1}100%{right:calc(100% + 80px);opacity:0;left:auto}}

  /* swinging pretzel from above */
  .pretzel{position:absolute;top:0;right:22%;width:60px;height:80px;z-index:1;pointer-events:none;transform-origin:30px 0;animation:swing 5s ease-in-out infinite}
  @keyframes swing{0%,100%{transform:rotate(-8deg)}50%{transform:rotate(8deg)}}

  /* steam */
  .steam-wrap{position:absolute;bottom:-12px;left:8%;width:90px;height:130px;pointer-events:none;z-index:1}
  .steam-wrap .grate{position:absolute;bottom:0;left:50%;transform:translateX(-50%);width:54px;height:7px;background:var(--border-hi);border-radius:2px}
  .steam-wrap .grate::before, .steam-wrap .grate::after{content:"";position:absolute;top:1px;width:2px;height:5px;background:var(--bg)}
  .steam-wrap .grate::before{left:14px}
  .steam-wrap .grate::after{right:14px}
  .puff{position:absolute;left:50%;bottom:8px;border-radius:50%;background:var(--ink-soft);opacity:0;animation:rise 7s ease-out infinite}
  .puff.p1{width:22px;height:22px;animation-delay:0s;margin-left:-11px}
  .puff.p2{width:18px;height:18px;animation-delay:2.3s;margin-left:-5px}
  .puff.p3{width:26px;height:26px;animation-delay:4.6s;margin-left:-15px}
  @keyframes rise{0%{transform:translateY(0) scale(.3);opacity:0}15%{opacity:.5}100%{transform:translateY(-110px) scale(1.6);opacity:0}}

  /* bagel */
  .bagel-float{position:absolute;right:6%;bottom:18%;width:78px;height:78px;animation:bagel-spin 22s linear infinite;pointer-events:none;z-index:1;opacity:.95}
  @keyframes bagel-spin{0%{transform:rotate(0) translateY(0)}50%{transform:rotate(180deg) translateY(-8px)}100%{transform:rotate(360deg) translateY(0)}}

  /* taxi */
  .taxi{position:absolute;bottom:30px;width:96px;height:36px;z-index:1;pointer-events:none;animation:drive-by 16s linear infinite;animation-delay:8s}
  @keyframes drive-by{0%{left:-120px}100%{left:calc(100% + 120px)}}

  /* pizza slice — tumbles diagonally */
  .pizza{position:absolute;top:-100px;width:56px;height:56px;z-index:1;pointer-events:none;animation:pizza-fall 28s linear infinite;animation-delay:14s}
  @keyframes pizza-fall{
    0%{top:-100px;left:80%;transform:rotate(0)}
    100%{top:120%;left:-10%;transform:rotate(720deg)}
  }

  /* subway car — passes through horizontally */
  .subway{position:absolute;top:38%;width:220px;height:56px;z-index:1;pointer-events:none;animation:subway-go 18s linear infinite;animation-delay:6s}
  @keyframes subway-go{0%{left:calc(100% + 240px)}100%{left:-240px}}

  /* bacon egg + cheese tumbles diagonally the other way */
  .bec{position:absolute;top:-90px;width:64px;height:64px;z-index:1;pointer-events:none;animation:bec-fall 34s linear infinite;animation-delay:20s}
  @keyframes bec-fall{
    0%{top:-90px;left:8%;transform:rotate(0)}
    100%{top:120%;left:78%;transform:rotate(-540deg)}
  }

  /* pizza rat — scurries along the bottom dragging a slice */
  .rat{position:absolute;bottom:24px;width:64px;height:28px;z-index:1;pointer-events:none;animation:rat-run 19s linear infinite;animation-delay:12s}
  @keyframes rat-run{0%{left:calc(100% + 80px)}100%{left:-100px}}
  .rat-body{animation:scamper .15s ease-in-out infinite alternate}
  @keyframes scamper{from{transform:translateY(0)}to{transform:translateY(-1.5px)}}

  /* anthora coffee cup — floats up and bobs */
  .anthora{position:absolute;top:34%;left:4%;width:48px;height:62px;z-index:1;pointer-events:none;animation:bob-float 5s ease-in-out infinite}
  @keyframes bob-float{0%,100%{transform:translateY(0) rotate(-3deg)}50%{transform:translateY(-10px) rotate(3deg)}}
  .anthora-steam{transform-origin:center bottom;animation:steam-wiggle 2s ease-in-out infinite alternate}
  @keyframes steam-wiggle{from{transform:translateX(-2px) scaleY(.9)}to{transform:translateX(2px) scaleY(1.1)}}

  /* metrocard — floats horizontally with slow tilt */
  .metrocard{position:absolute;top:62%;width:84px;height:54px;z-index:1;pointer-events:none;animation:card-glide 26s linear infinite;animation-delay:16s}
  @keyframes card-glide{
    0%{left:-100px;transform:rotate(-8deg)}
    50%{transform:rotate(8deg)}
    100%{left:calc(100% + 100px);transform:rotate(-8deg)}
  }

  /* hot dog cart umbrella */
  .hotdog{position:absolute;bottom:80px;right:14%;width:60px;height:80px;z-index:1;pointer-events:none;animation:sway 4s ease-in-out infinite}
  @keyframes sway{0%,100%{transform:rotate(-2deg)}50%{transform:rotate(2deg)}}

  /* celebration burst (extra pigeons + pizza on spin) */
  .burst{position:absolute;pointer-events:none;z-index:2;opacity:0;transition:opacity .3s}
  .burst.on{opacity:1}
  .burst-pigeon{position:absolute;width:32px;height:24px;animation:burst-fly 1.2s ease-out forwards}
  @keyframes burst-fly{
    0%{transform:translate(0,0) scale(.4) rotate(0);opacity:1}
    100%{transform:translate(var(--tx),var(--ty)) scale(1) rotate(var(--tr));opacity:0}
  }

  /* ───── itinerary reveal ───── */
  .reveal{display:none;padding:80px 32px 120px;border-top:1px solid var(--border);background:var(--bg-deep);position:relative}
  .reveal.on{display:block;animation:fadeUp .6s ease-out}
  @keyframes fadeUp{from{opacity:0;transform:translateY(20px)}to{opacity:1;transform:translateY(0)}}
  .reveal-frame{max-width:920px;margin:0 auto}
  .reveal-head{margin-bottom:48px;padding-bottom:24px;border-bottom:1px solid var(--border-hi)}
  .reveal-eyebrow{font-family:var(--mono);font-size:11px;letter-spacing:.18em;text-transform:uppercase;color:var(--knicks-orange);margin-bottom:20px;display:flex;align-items:center;gap:10px}
  .reveal-eyebrow::before{content:"";display:block;width:24px;height:1px;background:var(--knicks-orange)}
  .reveal-eyebrow .train{display:inline-flex;width:20px;height:20px;border-radius:50%;align-items:center;justify-content:center;font-family:var(--mono);font-weight:700;font-size:11px;color:white;margin-left:8px}
  .reveal-eyebrow .train-F{background:#FF6319}
  .reveal-eyebrow .train-1,.reveal-eyebrow .train-2,.reveal-eyebrow .train-3{background:#EE352E}
  .reveal-eyebrow .train-7{background:#B933AD}
  .reveal-eyebrow .train-G{background:#6CBE45}
  .reveal-eyebrow .train-L{background:#A7A9AC;color:#1F1A14}
  .reveal h2{font-family:var(--serif);font-size:clamp(48px,7vw,84px);font-weight:400;line-height:.98;letter-spacing:-.02em;color:var(--ink);font-variation-settings:"SOFT" 100,"WONK" 1;margin-bottom:16px}
  .reveal h2 em{font-style:italic;color:var(--knicks-orange)}
  .reveal .summary{font-family:var(--serif);font-style:italic;font-size:22px;color:var(--ink-soft);font-variation-settings:"SOFT" 100;line-height:1.5;max-width:60ch}

  .stops{margin:0;padding:0;list-style:none}
  .stop{display:grid;grid-template-columns:120px 1fr;gap:28px;padding:22px 0;border-bottom:1px solid var(--border);align-items:start}
  .stop:hover{background:rgba(245,132,38,.03)}
  .stop-time{font-family:var(--mono);font-size:13px;color:var(--knicks-orange);letter-spacing:.04em;font-weight:700;padding-top:4px}
  .stop-time small{display:block;font-weight:400;color:var(--ink-soft);font-size:10px;letter-spacing:.1em;text-transform:uppercase;margin-top:4px}
  .stop-body .place{font-family:var(--serif);font-style:italic;font-size:28px;font-weight:400;letter-spacing:-.01em;color:var(--ink);font-variation-settings:"SOFT" 100;line-height:1.15;margin-bottom:6px}
  .stop-body .note{font-family:var(--mono);font-size:12px;color:var(--ink-soft);line-height:1.6;margin-bottom:8px;max-width:55ch}
  .stop-body .addr{font-family:var(--mono);font-size:11px;color:var(--ink-tertiary);letter-spacing:.02em;margin-bottom:10px}
  .stop-body .links{display:flex;gap:12px;flex-wrap:wrap}
  .stop-body .links a{font-family:var(--mono);font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--knicks-orange);border:1px solid var(--knicks-orange);padding:5px 10px;border-radius:30px;transition:all .15s}
  .stop-body .links a:hover{background:var(--knicks-orange);color:var(--bg)}
  .stop-body .links a.resy{color:var(--knicks-blue);border-color:var(--knicks-blue)}
  .stop-body .links a.resy:hover{background:var(--knicks-blue);color:var(--ink)}

  .roll-again{margin-top:64px;display:flex;flex-direction:column;align-items:center;gap:14px}
  .roll-btn{font-family:var(--serif);font-style:italic;font-size:24px;font-variation-settings:"SOFT" 100,"WONK" 1;padding:18px 36px;border:2px solid var(--ink);border-radius:60px;color:var(--ink);background:transparent;transition:all .2s}
  .roll-btn:hover{background:var(--knicks-orange);color:var(--bg);border-color:var(--knicks-orange);transform:rotate(-1deg)}
  .roll-meta{font-family:var(--mono);font-size:11px;color:var(--ink-tertiary);letter-spacing:.04em}

  /* footer */
  footer{padding:32px;font-family:var(--mono);font-size:11px;color:var(--ink-tertiary);letter-spacing:.04em;text-align:center;border-top:1px solid var(--border);background:var(--bg)}
  footer em{font-family:var(--serif);font-style:italic;font-size:14px;color:var(--ink-soft);font-variation-settings:"SOFT" 100}
  footer a{color:var(--knicks-orange)}

  @media (max-width:700px){
    .pigeon,.steam-wrap,.bagel-float,.taxi,.squiggle,.pizza,.subway,.bec,.hotdog,.pretzel,.rat,.anthora,.metrocard{display:none}
    .stop{grid-template-columns:1fr;gap:8px}
    .stop-time{padding-top:0}
    .spin-btn{font-size:24px;padding:22px 44px}
  }
</style>
</head>
<body>

  <!-- marquee -->
  <div class="marquee">
    <div class="marquee-track">
      <span>no place like <em>nyc</em> <span class="glyph">●</span></span>
      <span>one day, picked at random <span class="glyph">●</span></span>
      <span>no place like <em>nyc</em> <span class="glyph">●</span></span>
      <span>one day, picked at random <span class="glyph">●</span></span>
      <span>no place like <em>nyc</em> <span class="glyph">●</span></span>
      <span>one day, picked at random <span class="glyph">●</span></span>
    </div>
  </div>

  <!-- hero -->
  <section class="hero">
    <div class="hero-frame">
      <h1>nyc itinerary<br/><em>roulette.</em></h1>
      <button id="spin" class="spin-btn">spin the day <span class="arrow">→</span></button>
      <div class="spinning-display" id="spinning"></div>
    </div>

    <!-- ambient animations -->
    <svg class="squiggle" viewBox="0 0 200 60" fill="none" stroke="#F58426" stroke-width="2" stroke-linecap="round" aria-hidden="true">
      <path d="M5 30 Q 25 5, 45 30 T 85 30 T 125 30 T 165 30 T 195 30" />
    </svg>

    <svg class="pigeon" viewBox="0 0 54 36" aria-hidden="true">
      <g fill="#888888">
        <ellipse cx="26" cy="22" rx="14" ry="7"/>
        <rect x="22" y="28" width="1.6" height="6" fill="#F58426"/>
        <rect x="28" y="28" width="1.6" height="6" fill="#F58426"/>
        <path d="M 12 22 L 4 19 L 4 21 L 14 26 Z" fill="#5A5A5A"/>
        <g class="pigeon-head">
          <circle cx="42" cy="16" r="6"/>
          <path d="M 48 16 L 53 15 L 53 17 Z" fill="#F58426"/>
          <circle cx="44" cy="14.5" r="1" fill="#FFFFFF"/>
          <circle cx="44" cy="14.5" r=".5" fill="#0A0A0A"/>
        </g>
      </g>
    </svg>

    <div class="steam-wrap">
      <div class="puff p1"></div>
      <div class="puff p2"></div>
      <div class="puff p3"></div>
      <div class="grate"></div>
    </div>

    <svg class="bagel-float" viewBox="0 0 80 80" aria-hidden="true">
      <circle cx="40" cy="40" r="32" fill="#C28A4C" stroke="#F58426" stroke-width="1.5"/>
      <circle cx="40" cy="40" r="12" fill="#0A0A0A" stroke="#F58426" stroke-width="1.5"/>
      <circle cx="22" cy="28" r="1.5" fill="#1F1A14"/>
      <circle cx="58" cy="32" r="1.5" fill="#1F1A14"/>
      <circle cx="50" cy="56" r="1.5" fill="#1F1A14"/>
      <circle cx="28" cy="54" r="1.5" fill="#1F1A14"/>
      <circle cx="62" cy="48" r="1.5" fill="#1F1A14"/>
      <circle cx="20" cy="42" r="1.5" fill="#1F1A14"/>
      <circle cx="40" cy="20" r="1.5" fill="#1F1A14"/>
    </svg>

    <svg class="taxi" viewBox="0 0 96 36" aria-hidden="true">
      <rect x="6" y="14" width="84" height="14" rx="3" fill="#FCCC0A"/>
      <path d="M 18 14 L 28 6 L 68 6 L 78 14 Z" fill="#FCCC0A"/>
      <rect x="22" y="8" width="20" height="6" fill="#0A0A0A" opacity=".4"/>
      <rect x="54" y="8" width="20" height="6" fill="#0A0A0A" opacity=".4"/>
      <circle cx="22" cy="30" r="5" fill="#1A1A1A"/>
      <circle cx="74" cy="30" r="5" fill="#1A1A1A"/>
      <rect x="38" y="18" width="20" height="4" fill="#0A0A0A"/>
      <text x="48" y="22" font-family="monospace" font-size="3" fill="#FCCC0A" text-anchor="middle" font-weight="700">NYC TAXI</text>
    </svg>

    <!-- pizza slice tumbling across -->
    <svg class="pizza" viewBox="0 0 60 60" aria-hidden="true">
      <path d="M 30 4 L 4 54 L 56 54 Z" fill="#E8B547" stroke="#8B6914" stroke-width="1.5"/>
      <path d="M 4 54 L 56 54 L 56 58 L 4 58 Z" fill="#C8983D"/>
      <circle cx="22" cy="38" r="4" fill="#C24A2A"/>
      <circle cx="38" cy="32" r="3" fill="#C24A2A"/>
      <circle cx="30" cy="48" r="3" fill="#C24A2A"/>
      <circle cx="42" cy="46" r="2.5" fill="#C24A2A"/>
      <path d="M 18 28 L 22 30 L 20 34 Z" fill="#FFFFFF" opacity=".7"/>
      <path d="M 36 22 L 40 24 L 38 28 Z" fill="#FFFFFF" opacity=".7"/>
    </svg>

    <!-- second pigeon, going the other way -->
    <svg class="pigeon pigeon-2" viewBox="0 0 54 36" aria-hidden="true">
      <g fill="#888888">
        <ellipse cx="26" cy="22" rx="14" ry="7"/>
        <rect x="22" y="28" width="1.6" height="6" fill="#F58426"/>
        <rect x="28" y="28" width="1.6" height="6" fill="#F58426"/>
        <path d="M 12 22 L 4 19 L 4 21 L 14 26 Z" fill="#5A5A5A"/>
        <g class="pigeon-head">
          <circle cx="42" cy="16" r="6"/>
          <path d="M 48 16 L 53 15 L 53 17 Z" fill="#F58426"/>
          <circle cx="44" cy="14.5" r="1" fill="#FFFFFF"/>
          <circle cx="44" cy="14.5" r=".5" fill="#0A0A0A"/>
        </g>
      </g>
    </svg>

    <!-- swinging pretzel -->
    <svg class="pretzel" viewBox="0 0 60 80" aria-hidden="true">

          {time:"10:30 AM", type:"garden", place:"Brooklyn Botanic Garden", note:"$22. the cherry trees in spring, the rose garden in summer, the conservatory in winter.", addr:"990 Washington Ave, Prospect Heights", maps:"https://www.google.com/maps/search/?api=1&query=Brooklyn+Botanic+Garden"},
          {time:"12:30 PM", type:"lunch", place:"Agi's Counter", note:"hungarian-jewish lunch counter, michelin bib. the chicken paprikash, the kürtős kalács. 10-min walk from the museum. thurs–sun only.", addr:"818 Franklin Ave, Crown Heights", maps:"https://www.google.com/maps/search/?api=1&query=Agi%27s+Counter+Crown+Heights", resy:"https://resy.com/cities/new-york-ny/venues/agis-counter"},
          {time:"2:30 PM", type:"museum", place:"Brooklyn Museum", note:"first saturday of the month is free + late. otherwise pay-what-you-wish always. closed mon + tues.", addr:"200 Eastern Pkwy, Prospect Heights", maps:"https://www.google.com/maps/search/?api=1&query=Brooklyn+Museum"},
          {time:"5:00 PM", type:"park", place:"Prospect Park — the Long Meadow", note:"enter at grand army plaza, walk to the meadow, find a tree, lie down.", addr:"Long Meadow, Prospect Park", maps:"https://www.google.com/maps/search/?api=1&query=Prospect+Park+Long+Meadow"},
          {time:"7:00 PM", type:"wine", place:"Glady's (or the Vanderbilt strip)", note:"jamaican rum bar on franklin. order the curry goat + a planter's punch.", addr:"788 Franklin Ave, Crown Heights", maps:"https://www.google.com/maps/search/?api=1&query=Glady%27s+Brooklyn"},
          {time:"8:30 PM", type:"dinner", place:"Gertrude's", note:"new york bistro by the gertie's deli team. the reuben burger, the dill-pickle chicken, the seven-layer cake. book ahead.", addr:"605 Carlton Ave, Prospect Heights", maps:"https://www.google.com/maps/search/?api=1&query=Gertrudes+Brooklyn+Carlton", resy:"https://resy.com/cities/new-york-ny/venues/gertrudes"}
        ]
      },
      {
        name: "the 24-hour show-off",
        neighborhood: "LES → midtown → UES",
        train: "6",
        summary: "you have one day. someone you love is in town. you want to do everything. start strong, hit the icons in the right order, end somewhere they'll text you about for weeks.",
        stops: [
          {time:"9:00 AM", type:"breakfast", place:"Russ & Daughters Cafe", note:"salmon eggs benedict + a latke + a latte. you'll need every calorie.", addr:"127 Orchard St, LES", maps:"https://www.google.com/maps/search/?api=1&query=Russ+%26+Daughters+Cafe", resy:"https://resy.com/cities/new-york-ny/venues/russ-and-daughters-cafe"},
          {time:"11:00 AM", type:"icon", place:"Brooklyn Bridge walk", note:"manhattan side → brooklyn side. then 6 train back. don't double-walk it.", addr:"Brooklyn Bridge", maps:"https://www.google.com/maps/search/?api=1&query=Brooklyn+Bridge"},
          {time:"1:00 PM", type:"lunch", place:"Katz's Delicatessen", note:"pastrami on rye + a dr brown's. the line moves. don't skip.", addr:"205 E Houston St, LES", maps:"https://www.google.com/maps/search/?api=1&query=Katz%27s+Delicatessen"},
          {time:"3:00 PM", type:"museum", place:"The Met", note:"3rd floor european paintings + the temple of dendur + the roof if it's open. give it 2 hours minimum. closed wednesdays.", addr:"1000 5th Ave, UES", maps:"https://www.google.com/maps/search/?api=1&query=The+Metropolitan+Museum+of+Art"},
          {time:"5:30 PM", type:"sunset", place:"Top of the Rock", note:"book the timed ticket in advance. better view than ESB. don't argue.", addr:"30 Rockefeller Plaza", maps:"https://www.google.com/maps/search/?api=1&query=Top+of+the+Rock+NYC"},
          {time:"7:30 PM", type:"dinner", place:"Frenchette", note:"keith mcnally's tribeca move. duck frites or the steak. natural wine list is the best in the city.", addr:"241 W Broadway, Tribeca", maps:"https://www.google.com/maps/search/?api=1&query=Frenchette+NYC", resy:"https://resy.com/cities/new-york-ny/venues/frenchette"},
          {time:"10:30 PM", type:"nightcap", place:"Bemelmans Bar at The Carlyle", note:"the closing argument. live piano. martinis. they'll bring this up at thanksgiving in three years.", addr:"35 E 76th St, UES", maps:"https://www.google.com/maps/search/?api=1&query=Bemelmans+Bar"}
        ]
      },
      {
        name: "the rainy day backup",
        neighborhood: "all indoors · weather-proof",
        train: "6",
        summary: "umbrella in your bag. cozy breakfast, three floors of books, oyster bar with vaulted tiles, a museum, an intimate dinner, a martini with live piano. you'll forget it's raining.",
        stops: [
          {time:"10:00 AM", type:"breakfast", place:"Buvette", note:"tiny french bistro, cramped on purpose. order the tartine + a cappuccino. the window steams up. it's perfect.", addr:"42 Grove St, West Village", maps:"https://www.google.com/maps/search/?api=1&query=Buvette+NYC", resy:"https://resy.com/cities/new-york-ny/venues/buvette-nyc"},
          {time:"12:00 PM", type:"books", place:"The Strand", note:"18 miles of books, three floors, decades old. spend an hour minimum.", addr:"828 Broadway, Union Square", maps:"https://www.google.com/maps/search/?api=1&query=The+Strand+Bookstore"},
          {time:"2:00 PM", type:"lunch", place:"Grand Central Oyster Bar", note:"vaulted tile ceiling, oyster pan roast, a martini. you're underground anyway.", addr:"89 E 42nd St, Grand Central", maps:"https://www.google.com/maps/search/?api=1&query=Grand+Central+Oyster+Bar"},
          {time:"4:00 PM", type:"museum", place:"The Morgan Library", note:"smaller than the met, more focused. the rotunda + the manuscript room. closed mondays.", addr:"225 Madison Ave, Murray Hill", maps:"https://www.google.com/maps/search/?api=1&query=The+Morgan+Library"},
          {time:"6:30 PM", type:"break", place:"Hotel lobby of your choice", note:"the Beekman atrium, the Greenwich, the Bowery. read for an hour. nobody will bother you.", addr:"various", maps:"https://www.google.com/maps/search/?api=1&query=The+Beekman+Hotel+NYC"},
          {time:"8:00 PM", type:"dinner", place:"I Sodi", note:"the lasagna. tiny candlelit room. you forget about the weather entirely.", addr:"105 Christopher St, West Village", maps:"https://www.google.com/maps/search/?api=1&query=I+Sodi+NYC", resy:"https://resy.com/cities/new-york-ny/venues/i-sodi"},
          {time:"10:30 PM", type:"nightcap", place:"Bemelmans Bar at The Carlyle", note:"live piano. dim lighting. the martini you came uptown for. dress for it.", addr:"35 E 76th St, UES", maps:"https://www.google.com/maps/search/?api=1&query=Bemelmans+Bar"}
        ]
      }
    ];

    // ───── roulette spin ─────
    const spinBtn = document.getElementById('spin');
    const spinDisplay = document.getElementById('spinning');
    const reveal = document.getElementById('reveal');
    const allPlaces = ITINS.flatMap(i => i.stops.map(s => s.place));
    let lastIdx = -1;

    function spin(){
      spinBtn.classList.add('spinning');
      spinBtn.textContent = 'spinning...';
      spinDisplay.classList.add('on');

      // flash through random place names
      let ticks = 0;
      const flashTimer = setInterval(() => {
        spinDisplay.textContent = allPlaces[Math.floor(Math.random() * allPlaces.length)];
        ticks++;
        if (ticks > 14) {
          clearInterval(flashTimer);
          finishSpin();
        }
      }, 90);
    }

    function finishSpin(){
      let idx;
      do { idx = Math.floor(Math.random() * ITINS.length); } while (idx === lastIdx && ITINS.length > 1);
      lastIdx = idx;
      const it = ITINS[idx];

      spinBtn.classList.remove('spinning');
      spinBtn.innerHTML = 'spin again <span class="arrow">→</span>';
      spinDisplay.classList.remove('on');

      renderItinerary(it);
      reveal.classList.add('on');
      setTimeout(() => reveal.scrollIntoView({behavior:'smooth', block:'start'}), 100);
    }

    function renderItinerary(it){
      document.getElementById('reveal-meta').textContent = 'today · ' + it.neighborhood;
      const trainEl = document.getElementById('reveal-train');
      trainEl.textContent = it.train;
      trainEl.className = 'train train-' + it.train;
      document.getElementById('reveal-title').innerHTML = it.name.replace(/(BoCoCa|brooklyn heights|queens|west village|east village|crawl|saturday|sunday|night|classic|deep cut|by the water)/i, '<em>$1</em>');
      document.getElementById('reveal-summary').textContent = it.summary;

      const list = document.getElementById('stops-list');
      list.innerHTML = '';
      it.stops.forEach(s => {
        const li = document.createElement('li');
        li.className = 'stop';
        const links = [];
        if (s.resy) links.push('<a class="resy" href="' + s.resy + '" target="_blank" rel="noopener">book on resy ↗</a>');
        if (s.web) links.push('<a href="' + s.web + '" target="_blank" rel="noopener">website ↗</a>');
        if (s.maps) links.push('<a href="' + s.maps + '" target="_blank" rel="noopener">view on map ↗</a>');
        li.innerHTML =
          '<div class="stop-time">' + s.time + '<small>' + s.type + '</small></div>' +
          '<div class="stop-body">' +
            '<p class="place">' + s.place + '</p>' +
            '<p class="note">' + s.note + '</p>' +
            '<p class="addr">' + s.addr + '</p>' +
            '<div class="links">' + links.join('') + '</div>' +
          '</div>';
        list.appendChild(li);
      });
    }

    spinBtn.addEventListener('click', () => { spin(); burst(); });
    document.getElementById('roll').addEventListener('click', () => {
      window.scrollTo({top:0, behavior:'smooth'});
      setTimeout(() => { spin(); burst(); }, 400);
    });

    // ───── celebration burst on spin ─────
    const burstEl = document.getElementById('burst');
    function burst(){
      burstEl.innerHTML = '';
      burstEl.classList.add('on');
      const btnRect = spinBtn.getBoundingClientRect();
      const heroRect = burstEl.parentElement.getBoundingClientRect();
      const cx = btnRect.left + btnRect.width/2 - heroRect.left;
      const cy = btnRect.top + btnRect.height/2 - heroRect.top;
      const items = ['🍕','🥯','🌭','🗽','🚕','🥨','🍎','🐦','☕','🎟️'];
      for (let i = 0; i < 12; i++){
        const span = document.createElement('span');
        span.className = 'burst-pigeon';
        span.textContent = items[Math.floor(Math.random() * items.length)];
        span.style.cssText =
          'position:absolute;left:' + cx + 'px;top:' + cy + 'px;' +
          'font-size:24px;' +
          '--tx:' + (Math.random() * 400 - 200) + 'px;' +
          '--ty:' + (Math.random() * -300 - 80) + 'px;' +
          '--tr:' + (Math.random() * 720 - 360) + 'deg;';
        burstEl.appendChild(span);
      }
      setTimeout(() => burstEl.classList.remove('on'), 1300);
    }
  </script>
